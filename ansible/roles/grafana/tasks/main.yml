- name: Ensure grafana user exists
  user:
    name: grafana
    system: yes
    shell: /sbin/nologin
    create_home: no

- name: Ensure grafana directories
  file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /usr/share/grafana
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana

- name: Download Grafana OSS tar
  get_url:
    url: "https://dl.grafana.com/oss/release/grafana-9.5.8.linux-amd64.tar.gz"
    dest: /tmp/graf.tar.gz

- name: Extract Grafana
  unarchive:
    src: /tmp/graf.tar.gz
    dest: /usr/share
    remote_src: yes
    creates: /usr/share/grafana-9.5.8

- name: Symlink grafana current
  file:
    src: /usr/share/grafana-9.5.8
    dest: /usr/share/grafana
    state: link
    force: yes

- name: Upload grafana ini
  template:
    src: grafana.ini.j2
    dest: /usr/share/grafana/conf/custom.ini
    owner: grafana
    group: grafana
    mode: "0644"

- name: Upload datasource provisioning
  template:
    src: datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/datasources.yml
    owner: grafana
    group: grafana
    mode: "0644"

- name: Upload grafana systemd unit
  copy:
    src: files/grafana.service
    dest: /etc/systemd/system/grafana.service
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Enable and start grafana
  systemd:
    name: grafana
    enabled: yes
    state: started