- name: Ensure prometheus user exists
  user:
    name: prometheus
    system: yes
    shell: /sbin/nologin
    create_home: no

- name: Ensure directories exist
  file:
    path: "{{ item.path }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: /etc/prometheus, mode: '0755' }
    - { path: /var/lib/prometheus, mode: '0755' }

- name: Upload prometheus config
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: '0644'

- name: Upload prometheus systemd unit
  copy:
    src: files/prometheus.service
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: '0644'

- name: Download Prometheus
  get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v2.46.0/prometheus-2.46.0.linux-amd64.tar.gz"
    dest: /tmp/prom.tar.gz
    mode: '0644'

- name: Extract Prometheus
  unarchive:
    src: /tmp/prom.tar.gz
    dest: /tmp
    remote_src: yes

- name: Install prometheus binaries
  copy:
    src: "/tmp/prometheus-2.46.0.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: yes
  loop:
    - prometheus
    - promtool

- name: Copy consoles and libs
  copy:
    src: "/tmp/prometheus-2.46.0.linux-amd64/{{ item }}"
    dest: "/etc/prometheus/{{ item }}"
    owner: prometheus
    group: prometheus
    mode: "0755"
    remote_src: yes
  loop:
    - consoles
    - console_libraries

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Enable and start prometheus
  systemd:
    name: prometheus
    enabled: yes
    state: started